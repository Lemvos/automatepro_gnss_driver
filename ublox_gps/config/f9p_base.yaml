# Configuration Settings for C94-M8P device
ublox_gps_base_node:
  ros__parameters:
    debug: 0                    # Range 0-4 (0 means no debug statements will print)

    device: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver_F9P-if00
    frame_id: gps_base

    uart1:
      baudrate: 460800

    config_on_startup: false    # If false, the node will not override configurations of the device on startup
                                # Device should be configured with u-center and configurations should be saved in flash
                                # Please use the configuration file provided by Lemvos

    # GPIO configuration
    gpio:
      chipname: "gpiochip0"
      line_num: 134
      reset_time: 1
    
    # Recovery configuration
    recovery:
      cycle_time: 1
    
    # Watchdog configuration
    watchdog:
      timeout: 3000
      cycle_time: 500

    gnss:
      gps: true
      galileo: true
      glonass: true
      beidou: false
      qzss: false 

    inf: 
      all: true
    # Enable u-blox message publishers
    publish:
      all: false
      aid:
        hui: false
      nav:
        all: false
        posllh: true
        posecef: true
        relposned: false
